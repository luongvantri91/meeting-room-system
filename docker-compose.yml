services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meetingroom
      POSTGRES_USER: ${DB_USER:-meetingroom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-meetingroom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d meetingroom"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/meetingroom
      DB_USER: ${DB_USER:-meetingroom}
      DB_PASSWORD: ${DB_PASSWORD:-meetingroom}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
