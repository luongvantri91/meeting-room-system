spring:
  application:
    name: meeting-room-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meetingroom}
    username: ${DB_USER:meetingroom}
    password: ${DB_PASSWORD:meetingroom}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
